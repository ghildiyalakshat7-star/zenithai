    <!-- Tailwind CSS -->

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#030305',
                        card: 'rgba(15, 15, 20, 0.65)',
                        cardSolid: '#0f0f14',

                        borderHighlight: 'rgba(255, 255, 255, 0.2)',

                        secondary: '#4facfe',
                        accent: '#10b981',
                        danger: '#ff4b2b',
                        warning: '#f5af19'
                    },
                    fontFamily: {
                        sans:['Inter', 'sans-serif'],

                    },

                        'spin-slow': 'spin 12s linear infinite',
                        'spin-fast': 'spin 3s linear infinite',
                        'spin-reverse': 'spin 15s linear infinite reverse',
                        'spin-reverse-fast': 'spin 5s linear infinite reverse',
                        'float': 'float 8s ease-in-out infinite',
                        'float-delayed': 'float 8s ease-in-out 4s infinite',
                        'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
                        'entry': 'hologramEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-15px)' }

                            '0%, 100%': { opacity: '0.6', filter: 'brightness(1)' },

                        hologramEntry: {
                            '0%': { opacity: '0', transform: 'translateY(60px) translateZ(-100px) scale(0.9)', filter: 'blur(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0) translateZ(0) scale(1)', filter: 'blur(0)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #030305; color: #ffffff; overflow-x: hidden; perspective: 1500px; margin: 0; }

        ::-webkit-scrollbar-track { background: #030305; }

            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),

        .hologram-grid {

            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            transform-origin: center top;
            opacity: 0.4;
        }

        .glass-panel {
            background: rgba(15, 15, 20, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";

<body class="antialiased selection:bg-primary/50 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- UTILS & DATA ---
        const calculateEpaAqiFromPm25 = (pm25) => {
            if (pm25 === undefined || pm25 === null) return 0;
            const c = Math.floor(pm25 * 10) / 10;
            if (c <= 12.0) return Math.round(((50 - 0) / (12.0 - 0)) * c);
            if (c <= 35.4) return Math.round(((100 - 51) / (35.4 - 12.1)) * (c - 12.1) + 51);
            if (c <= 55.4) return Math.round(((150 - 101) / (55.4 - 35.5)) * (c - 35.5) + 101);
            if (c <= 150.4) return Math.round(((200 - 151) / (150.4 - 55.5)) * (c - 55.5) + 151);
            if (c <= 250.4) return Math.round(((300 - 201) / (250.4 - 150.5)) * (c - 150.5) + 201);
            if (c <= 350.4) return Math.round(((400 - 301) / (350.4 - 250.5)) * (c - 250.5) + 301);
            if (c <= 500.4) return Math.round(((500 - 401) / (500.4 - 350.5)) * (c - 350.5) + 401);
            return Math.round(((999 - 501) / (9999.9 - 500.5)) * (c - 500.5) + 501);
        };

        const calculateEpaAqiFromPm10 = (pm10) => {
            if (pm10 === undefined || pm10 === null) return 0;
            const c = Math.floor(pm10);
            if (c <= 54) return Math.round(((50 - 0) / (54 - 0)) * c);
            if (c <= 154) return Math.round(((100 - 51) / (154 - 55)) * (c - 55) + 51);
            if (c <= 254) return Math.round(((150 - 101) / (254 - 155)) * (c - 155) + 101);
            if (c <= 354) return Math.round(((200 - 151) / (354 - 255)) * (c - 255) + 151);
            if (c <= 424) return Math.round(((300 - 201) / (424 - 355)) * (c - 355) + 201);
            if (c <= 504) return Math.round(((400 - 301) / (504 - 425)) * (c - 425) + 301);
            if (c <= 604) return Math.round(((500 - 401) / (604 - 505)) * (c - 505) + 401);
            return Math.round(((999 - 501) / (9999 - 605)) * (c - 605) + 501);
        };

        const getAQIInfo = (aqi) => {
            if (aqi <= 50) return { status: 'Optimal', color: 'text-accent', hex: '#10b981', glow: 'rgba(16,185,129,0.4)', msg: 'Atmospheric conditions prime.', mask: 'None required' };
            if (aqi <= 100) return { status: 'Moderate', color: 'text-warning', hex: '#f5af19', glow: 'rgba(245,175,25,0.4)', msg: 'Acceptable parameters.', mask: 'Optional' };
            if (aqi <= 150) return { status: 'Elevated Risk', color: 'text-orange-500', hex: '#f97316', glow: 'rgba(249,115,22,0.4)', msg: 'Sensitive bio-forms at risk.', mask: 'Recommended' };
            if (aqi <= 200) return { status: 'Unhealthy', color: 'text-danger', hex: '#ff4b2b', glow: 'rgba(255,75,43,0.4)', msg: 'General population health alert.', mask: 'Mandatory N95' };
            if (aqi <= 300) return { status: 'Very Unhealthy', color: 'text-purple-500', hex: '#a855f7', glow: 'rgba(168,85,247,0.4)', msg: 'Severe atmospheric degradation.', mask: 'Respirator Required' };
            return { status: 'Hazardous', color: 'text-rose-600', hex: '#e11d48', glow: 'rgba(225,29,72,0.6)', msg: 'Toxic environment. Evacuate or seal perimeter.', mask: 'Hazmat/Respirator' };
        };

        const formatTime = (dateStr) => new Date(dateStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const formatDay = (dateStr) => new Date(dateStr).toLocaleDateString([], { weekday: 'short' });

        const getAccColor = (acc) => {
            if (acc >= 90) return { text: 'text-accent', bg: 'bg-accent', shadow: 'shadow-[0_0_10px_#10b981]', hex: '#10b981' };
            if (acc >= 75) return { text: 'text-warning', bg: 'bg-warning', shadow: 'shadow-[0_0_10px_#f5af19]', hex: '#f5af19' };
            return { text: 'text-danger', bg: 'bg-danger', shadow: 'shadow-[0_0_10px_#ff4b2b]', hex: '#ff4b2b' };
        };

        // --- 3D INTERACTIVE TILT CARD w/ MOUSE SPOTLIGHT ---
        const TiltCard = ({ children, className, depth = 20, delay = "0s" }) => {
            const ref = useRef(null);
            const[style, setStyle] = useState({ transform: 'perspective(1500px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)' });

            const handleMouseMove = (e) => {
                if (!ref.current) return;
                const rect = ref.current.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                ref.current.style.setProperty('--mouse-x', `${x}px`);
                ref.current.style.setProperty('--mouse-y', `${y}px`);

                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -depth;
                const rotateY = ((x - centerX) / centerX) * depth;
                
                setStyle({ transform: `perspective(1500px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)` });
            };

            const handleMouseLeave = () => {
                setStyle({ transform: 'perspective(1500px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)' });
                if(ref.current) {
                    ref.current.style.setProperty('--mouse-x', `50%`);
                    ref.current.style.setProperty('--mouse-y', `50%`);
                }
            };

            return (
                <div ref={ref} onMouseMove={handleMouseMove} onMouseLeave={handleMouseLeave} 
                     className={`transform-3d will-change-transform animate-entry ${className}`} 
                     style={{...style, animationDelay: delay, opacity: 0}}>
                    <div className="w-full h-full rounded-[inherit] relative transform-3d">
                        {children}
                    </div>
                </div>
            );
        };

        // --- LIVE HOLOGRAPHIC TERMINAL ---
        const LiveTerminal = ({ data, location, hex }) => {
            const[logs, setLogs] = useState([]);

            useEffect(() => {
                if (!data || !location) return;
                setLogs([]);
                const interval = setInterval(() => {
                    const time = new Date().toISOString().slice(11, 23); 
                    const templates =[
                        `[UPLINK] Securing telemetry link to ${location.name} regional sensors...`,
                        `[DATA] Polling real-time telemetry from ${data.current.source}...`,
                        `[SCAN] PM2.5 particle mass reading: ${data.current.pm25} µg/m³`,
                        `[AERO] Vector wind forces plotting at ${data.current.wind} km/h`,
                        `[CHEM] CO toxicity levels mapping: ${data.current.co} µg/m³`,
                        `[THERM] Surface infrared read: ${data.current.temp}°C`,
                        `[SYS] Deep AI routing dispersion matrix...`,
                        `[RAD] Solar radiation index spike: UVI ${data.current.uv}`,
                        `[WARN] Nitrogen Dioxide thresholds testing: ${data.current.no2} µg/m³`
                    ];
                    setLogs(prev => {
                        const updated =[...prev, { id: Date.now(), time, text: templates[Math.floor(Math.random() * templates.length)] }];
                        return updated.length > 5 ? updated.slice(updated.length - 5) : updated;
                    });
                }, 1200); 
                return () => clearInterval(interval);
            },[data, location]);

            return (
                <div className="bg-[#050508]/80 border border-border p-5 rounded-3xl relative overflow-hidden h-48 flex flex-col shadow-inner terminal-scanline">
                    <div className="flex justify-between items-center mb-3 pb-3 border-b border-white/10 z-10" style={{ transform: 'translateZ(20px)' }}>
                        <span className="text-xs font-bold text-muted uppercase tracking-widest flex items-center gap-2">
                            <i className="fas fa-terminal animate-pulse" style={{color: hex}}></i> System Log
                        </span>
                        <span className="flex h-2.5 w-2.5 relative">
                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75" style={{backgroundColor: hex}}></span>
                            <span className="relative inline-flex rounded-full h-2.5 w-2.5" style={{backgroundColor: hex}}></span>
                        </span>
                    </div>
                    <div className="flex-1 flex flex-col justify-end gap-2 font-mono text-xs overflow-hidden z-10 relative" style={{ transform: 'translateZ(30px)' }}>
                        <div className="absolute top-0 left-0 w-full h-10 bg-gradient-to-b from-[#050508] to-transparent z-20"></div>
                        {logs.map((log, index) => (
                            <div key={log.id} className="animate-fade-in flex gap-3 text-muted/80" style={{ opacity: (index + 1) / logs.length }}>
                                <span className="shrink-0 font-bold" style={{color: hex}}>[{log.time}]</span>
                                <span className="text-white/90 drop-shadow-md">{log.text}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- HOLOGRAPHIC CHART COMPONENT ---
        const ChartComponent = ({ data, labels, title, color }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');
                
                const gradient = ctx.createLinearGradient(0, 0, 0, 300);
                gradient.addColorStop(0, `${color}44`);
                gradient.addColorStop(1, `${color}00`);

                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets:[{
                            label: title,
                            data: data,
                            borderColor: color,
                            backgroundColor: gradient,
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4,
                            pointBackgroundColor: '#000',
                            pointBorderColor: color,
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 8,
                            pointHoverBackgroundColor: color,
                            pointHoverBorderColor: '#fff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(0,0,0,0.8)', titleColor: color, bodyColor: '#fff', borderColor: color, borderWidth: 1, padding: 12, bodyFont: { family: 'JetBrains Mono' }, displayColors: false } },
                        scales: { y: { grid: { color: 'rgba(255,255,255,0.05)', borderDash:[4, 4] }, border: { display: false }, ticks: { color: '#8b8b9f', font: { family: 'JetBrains Mono', size: 10 } } }, x: { grid: { display: false }, border: { display: false }, ticks: { color: '#8b8b9f', font: { family: 'JetBrains Mono', size: 10 } } } },
                        interaction: { mode: 'nearest', axis: 'x', intersect: false }
                    }
                });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); }
            },[data, labels, title, color]);

            return <div className="h-full w-full min-h-[200px] relative z-10"><canvas ref={chartRef}></canvas></div>;
        };

        // --- MAIN APPLICATION ---
        const App = () => {
            const[status, setStatus] = useState('prompting'); 
            const[data, setData] = useState(null);
            const [location, setLocation] = useState(null);
            const[activeMetric, setActiveMetric] = useState('aqi'); 
            const[searchQuery, setSearchQuery] = useState('');
            const[searchResults, setSearchResults] = useState([]);
            const[isSearchDropdownOpen, setIsSearchDropdownOpen] = useState(false);
            const[showRawAQI, setShowRawAQI] = useState(false);
            const [showMap, setShowMap] = useState(false);
            const[expandedProtocols, setExpandedProtocols] = useState({ mask: false, hvac: false });

            // About Website / Explain Modal State
            const[showAboutModal, setShowAboutModal] = useState(false);

            // Global Parallax Mouse Tracking
            const[mousePos, setMousePos] = useState({ x: 0, y: 0, rawX: 0, rawY: 0 });

            useEffect(() => {
                const handleGlobalMouse = (e) => {
                    const x = (e.clientX / window.innerWidth - 0.5);
                    const y = (e.clientY / window.innerHeight - 0.5);
                    setMousePos({ x, y, rawX: e.clientX, rawY: e.clientY });
                };
                window.addEventListener('mousemove', handleGlobalMouse);
                return () => window.removeEventListener('mousemove', handleGlobalMouse);
            },[]);

            const fetchRealTimeData = async (lat, lon, locName = null, country = null) => {
                try {
                    setStatus('fetching');
                    setIsSearchDropdownOpen(false);
                    setSearchQuery('');
                    
                    let finalLocName = locName;
                    let finalCountry = country;
                    
                    if (!locName) {
                        const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                        const geoData = await geoRes.json();
                        const address = geoData.address || {};
                        finalLocName = address.neighbourhood || address.suburb || address.city_district || address.city || address.town || address.state || 'Local Sector';
                        finalCountry = address.country || '';
                    }

                    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,precipitation,uv_index&hourly=temperature_2m,relative_humidity_2m,wind_speed_10m,precipitation_probability,uv_index&past_days=1&forecast_days=7`);
                    const weatherData = await weatherRes.json();

                    const aqiRes = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=pm10,pm2_5,carbon_monoxide,nitrogen_dioxide,sulphur_dioxide,ozone,us_aqi&hourly=pm10,pm2_5,us_aqi&past_days=1&forecast_days=7`);
                    const aqiData = await aqiRes.json();

                    let waqiAqi = null;
                    let sourceName = 'Open-Meteo Satellite Array';
                    try {
                        const waqiRes = await fetch(`https://api.waqi.info/feed/geo:${lat};${lon}/?token=d9c0f3c71143407d61c900d9dbb450489303e7e8`);
                        const waqiData = await waqiRes.json();
                        if (waqiData.status === 'ok' && waqiData.data && waqiData.data.aqi) {
                            const parsedAqi = parseInt(waqiData.data.aqi, 10);
                            if(!isNaN(parsedAqi) && parsedAqi > 0) {
                                waqiAqi = parsedAqi;
                                const stName = waqiData.data.city && waqiData.data.city.name ? waqiData.data.city.name : 'Ground Sensor';
                                sourceName = `AQICN Station: ${stName.split(',')[0].substring(0, 22)}`;
                            }
                        }
                    } catch (e) {
                        console.warn("AQICN data unavailable, falling back to Open-Meteo");
                    }

                    const calcPm25 = calculateEpaAqiFromPm25(aqiData.current.pm2_5);
                    const calcPm10 = calculateEpaAqiFromPm10(aqiData.current.pm10);
                    const fallbackAqi = Math.max(calcPm25, calcPm10);
                    
                    const omAqi = aqiData.current.us_aqi ? Math.round(aqiData.current.us_aqi) : fallbackAqi; 
                    let actualAqi = (waqiAqi !== null) ? waqiAqi : omAqi; 
                    
                    const currentHourObj = new Date(); currentHourObj.setMinutes(0,0,0); 
                    let currentIndex = aqiData.hourly.time.findIndex(t => t === currentHourObj.toISOString().slice(0, 13) + ":00");
                    if (currentIndex === -1) currentIndex = 24; 

                    const buildShortTerm = (sourceArray) => {
                        let trend=[], forecast=[], labelsTrend=[], labelsForecast=[];
                        for(let i=currentIndex-6; i<=currentIndex; i++) {
                            if(sourceArray[i] !== undefined) {
                                trend.push(sourceArray[i]);
                                labelsTrend.push(i === currentIndex ? 'Now' : formatTime(aqiData.hourly.time[i]));
                            }
                        }
                        for(let i=currentIndex+1; i<=currentIndex+6; i++) {
                            if(sourceArray[i] !== undefined) {
                                forecast.push(sourceArray[i]);
                                labelsForecast.push(formatTime(aqiData.hourly.time[i]));
                            }
                        }
                        return { trend, forecast, labelsTrend, labelsForecast };
                    };

                    const buildWeeklyData = (sourceArray) => {
                        let weekly=[], labelsWeekly=[];
                        for(let i=0; i<7; i++) {
                            let targetIdx = currentIndex + (i * 24);
                            if(targetIdx < sourceArray.length) {
                                weekly.push(sourceArray[targetIdx]);
                                labelsWeekly.push(i === 0 ? 'Today' : formatDay(aqiData.hourly.time[targetIdx]));
                            }
                        }
                        return { weekly, labelsWeekly };
                    };

                    const processMetric = (source) => ({
                        ...buildShortTerm(source),
                        ...buildWeeklyData(source)
                    });

                    setLocation({ lat: Number(lat).toFixed(4), lon: Number(lon).toFixed(4), name: finalLocName, country: finalCountry });
                    setData({
                        current: {
                            aqi: actualAqi, 
                            calculatedAqi: fallbackAqi, 
                            actualAqi: actualAqi, 
                            source: sourceName,
                            temp: Math.round(weatherData.current.temperature_2m), 
                            humidity: Math.round(weatherData.current.relative_humidity_2m),
                            wind: weatherData.current.wind_speed_10m, 
                            uv: weatherData.current.uv_index, 
                            rain: weatherData.current.precipitation,
                            pm25: aqiData.current.pm2_5, 
                            pm10: aqiData.current.pm10, 
                            co: aqiData.current.carbon_monoxide, 
                            no2: aqiData.current.nitrogen_dioxide,
                        },
                        charts: {
                            aqi: processMetric(aqiData.hourly.us_aqi || aqiData.hourly.pm2_5.map(calculateEpaAqiFromPm25)),
                            temp: processMetric(weatherData.hourly.temperature_2m),
                            humidity: processMetric(weatherData.hourly.relative_humidity_2m),
                            wind: processMetric(weatherData.hourly.wind_speed_10m),
                            uv: processMetric(weatherData.hourly.uv_index),
                            rain: processMetric(weatherData.hourly.precipitation_probability)
                        }
                    });

                    setStatus('active');
                } catch (error) { setStatus('error'); }
            };

            const executeSearch = async (e) => {
                if(e) e.preventDefault();
                if(!searchQuery) return;
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&limit=5&addressdetails=1`);
                    const searchData = await res.json();
                    if(searchData && searchData.length > 0) {

                                <div className="grid grid-cols-2 md:grid-cols-3 gap-6">
                                    {[
                                        { id: 'aqi', icon: 'fa-radiation', label: 'Air Quality', val: data.current.aqi, unit: 'AQI', hex: aqiInfo.hex },
                                        { id: 'temp', icon: 'fa-temperature-full', label: 'Thermal', val: data.current.temp, unit: '°C', hex: '#f97316' },
                                        { id: 'humidity', icon: 'fa-droplet', label: 'Moisture', val: data.current.humidity, unit: '%', hex: '#3b82f6' },
                                        { id: 'wind', icon: 'fa-wind', label: 'Wind Vector', val: data.current.wind, unit: 'km/h', hex: '#e5e7eb' },
                                        { id: 'uv', icon: 'fa-sun', label: 'Radiation', val: data.current.uv, unit: 'UVI', hex: '#facc15' },
                                        { id: 'rain', icon: 'fa-cloud-showers-heavy', label: 'Precipitation', val: data.current.rain, unit: 'mm', hex: '#93c5fd' }
                                    ].map((m, i) => (
                                        <TiltCard key={m.id} delay={`${0.2 + (i * 0.1)}s`} depth={20} className="h-full">
                                            <div onClick={() => setActiveMetric(m.id)} className={`glass-panel p-6 rounded-[1.5rem] flex flex-col justify-between cursor-pointer group h-full transition-all duration-300 ${activeMetric === m.id ? 'bg-[#0a0a0f]/80' : ''}`} style={{ borderColor: activeMetric === m.id ? m.hex : 'rgba(255,255,255,0.05)', boxShadow: activeMetric === m.id ? `0 0 30px ${m.hex}44, inset 0 0 20px ${m.hex}22` : '' }}>
                                                <div className="absolute inset-0 opacity-0 group-hover:opacity-20 transition-opacity duration-500" style={{background: `radial-gradient(circle at 50% 50%, ${m.hex}, transparent 70%)`}}></div>
                                                <div className="flex items-center gap-4 mb-4 glass-content" style={{ transform: 'translateZ(30px)' }}>
                                                    <div className="relative flex items-center justify-center w-14 h-14">
                                                        <svg className="absolute inset-0 w-full h-full animate-spin-slow opacity-0 group-hover:opacity-80 transition-opacity duration-500 scale-[1.3]" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke={m.hex} strokeWidth="2" strokeDasharray="10 10" /></svg>
                                                        <div className="w-12 h-12 rounded-xl bg-black/50 border border-white/10 flex items-center justify-center text-xl transition-all shadow-inner relative z-10" style={{ color: activeMetric === m.id ? m.hex : '#8b8b9f', borderColor: activeMetric === m.id ? m.hex : '' }}>
                                                            <i className={`fas ${m.icon} group-hover:scale-110 group-hover:animate-pulse`}></i>
                                                        </div>
                                                    </div>
                                                    <p className="text-xs font-bold uppercase tracking-widest text-muted group-hover:text-white transition-colors">{m.label}</p>
                                                </div>
                                                <p className="text-4xl font-black font-mono text-white glass-content drop-shadow-lg" style={{ transform: 'translateZ(50px)' }}>{m.val} <span className="text-sm font-sans text-muted font-bold ml-1">{m.unit}</span></p>
                                            </div>
                                        </TiltCard>
                                    ))}
                                </div>

                                <TiltCard delay="0.8s" depth={15} className="flex-1">
                                    <div className="glass-panel p-8 rounded-[2rem] flex flex-col h-full min-h-[350px]">
                                        <div className="flex justify-between items-center mb-6 glass-content" style={{ transform: 'translateZ(30px)' }}>
                                            <h3 className="text-lg font-bold text-white flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-primary shadow-[0_0_15px_rgba(0,242,254,0.3)]"><i className="fas fa-history"></i></div>
                                                Recent History: <span style={{color: metricConfig.color}}>{metricConfig.title}</span>
                                            </h3>
                                            <span className="text-xs font-mono bg-black/50 px-3 py-1.5 rounded-lg border border-white/10 text-muted">PAST 6 HOURS</span>
                                        </div>
                                        <div className="flex-1 glass-content" style={{ transform: 'translateZ(50px)' }}>
                                            <ChartComponent data={currentChartData.trend} labels={currentChartData.labelsTrend} title={metricConfig.title} color={metricConfig.color} />
                                        </div>
                                    </div>
                                </TiltCard>
                            </div>
                        </div>

                        {/* ROW 2: LONG-TERM FORECAST & RELIABILITY MATRIX */}
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-8">
                            <TiltCard delay="0.9s" depth={15} className="lg:col-span-8">
                                <div className="glass-panel p-8 rounded-[2rem] flex flex-col h-full relative group">
                                    <div className="absolute inset-0 opacity-0 group-hover:opacity-10 transition-opacity duration-700" style={{background: `radial-gradient(circle at 50% 50%, ${metricConfig.color}, transparent 70%)`}}></div>
                                    <div className="mb-6 flex justify-between items-center glass-content" style={{ transform: 'translateZ(30px)' }}>
                                        <h3 className="text-2xl font-black text-white flex items-center gap-3 tracking-tight">
                                            <i className="fas fa-calendar-week text-primary animate-pulse"></i> 7-Day Extended Prediction
                                        </h3>
                                        <span className="px-4 py-1.5 rounded-xl bg-primary/10 text-primary border border-primary/30 text-xs font-bold tracking-[0.2em] shadow-[0_0_15px_rgba(0,242,254,0.3)]">MACRO-FORECAST</span>
                                    </div>
                                    <div className="flex-1 min-h-[300px] glass-content" style={{ transform: 'translateZ(50px)' }}>
                                        <ChartComponent data={currentChartData.weekly} labels={currentChartData.labelsWeekly} title={`7-Day ${metricConfig.title}`} color={metricConfig.color} />
                                    </div>
                                </div>
                            </TiltCard>

                            <TiltCard delay="1s" depth={15} className="lg:col-span-4">
                                <div className="glass-panel p-8 rounded-[2rem] flex flex-col h-full relative group">
                                    <div className="absolute inset-0 opacity-0 group-hover:opacity-10 transition-opacity duration-700" style={{background: `radial-gradient(circle at 50% 50%, #10b981, transparent 70%)`}}></div>
                                    <div className="mb-6 glass-content" style={{ transform: 'translateZ(30px)' }}>
                                        <h3 className="text-xl font-black text-white mb-1 tracking-tight">
                                            <i className="fas fa-microchip text-accent"></i> Reliability Matrix
                                        </h3>
                                        <p className="text-xs text-muted font-mono">Prediction confidence degradation.</p>
                                    </div>
                                    
                                    <div className="flex-1 flex flex-col gap-6 glass-content justify-center" style={{ transform: 'translateZ(50px)' }}>
                                        <div className="flex items-center gap-5 bg-black/40 p-4 rounded-2xl border border-white/5 shadow-inner">
                                            <div className={`w-16 h-16 rounded-full border-4 border-t-transparent flex items-center justify-center ${mainAccColor.shadow} relative`} style={{borderColor: `${mainAccColor.hex}44`, borderTopColor: mainAccColor.hex}}>
                                                <div className={`absolute inset-0 w-full h-full flex items-center justify-center font-black text-xl font-mono ${mainAccColor.text}`}>
                                                    {baseAcc}<span className="text-xs">%</span>
                                                </div>
                                            </div>
                                            <div>
                                                <div className="text-white font-bold text-lg">System Accuracy :</div>
                                                <div className={`${mainAccColor.text} text-xs font-mono tracking-widest mt-1`}>GLOBAL ENSEMBLE</div>
                                            </div>
                                        </div>
                                        
                                        <div className="space-y-4">
                                            <div>
                                                <div className="flex justify-between text-xs font-bold font-mono text-muted mb-1.5 uppercase tracking-widest">
                                                    <span>T+24 Hours</span><span className={color24.text}>{acc24}%</span>
                                                </div>
                                                <div className="h-2 w-full bg-black/50 rounded-full overflow-hidden border border-white/5"><div className={`h-full ${color24.bg} ${color24.shadow}`} style={{width: `${acc24}%`}}></div></div>
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-xs font-bold font-mono text-muted mb-1.5 uppercase tracking-widest">
                                                    <span>T+72 Hours</span><span className={color72.text}>{acc72}%</span>
                                                </div>
                                                <div className="h-2 w-full bg-black/50 rounded-full overflow-hidden border border-white/5"><div className={`h-full ${color72.bg} ${color72.shadow}`} style={{width: `${acc72}%`}}></div></div>
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-xs font-bold font-mono text-muted mb-1.5 uppercase tracking-widest">
                                                    <span>T+168 Hours</span><span className={color168.text}>{acc168}%</span>
                                                </div>
                                                <div className="h-2 w-full bg-black/50 rounded-full overflow-hidden border border-white/5"><div className={`h-full ${color168.bg} ${color168.shadow}`} style={{width: `${acc168}%`}}></div></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </TiltCard>
                        </div>

                        {/* ROW 3 */}
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-2 gap-8 mt-8 mb-12">
                            <TiltCard delay="1.1s" depth={12}>
                                <div className="glass-panel p-8 rounded-[2rem] flex flex-col h-full relative group">
                                    <div className="absolute inset-0 opacity-0 group-hover:opacity-10 transition-opacity duration-700" style={{background: `radial-gradient(circle at 50% 50%, #10b981, transparent 70%)`}}></div>
                                    <div className="mb-8 flex justify-between items-start glass-content" style={{ transform: 'translateZ(30px)' }}>
                                        <div>
                                            <h3 className="text-2xl font-black text-white mb-2 flex items-center gap-3 tracking-tight">
                                                <i className="fas fa-bolt text-accent"></i> Near-Term Projection
                                            </h3>
                                            <p className="text-sm text-muted font-mono ml-8">6-hour immediate future simulation.</p>
                                        </div>
                                    </div>
                                    <div className="flex-1 min-h-[250px] glass-content" style={{ transform: 'translateZ(50px)' }}>
                                        <ChartComponent data={currentChartData.forecast} labels={currentChartData.labelsForecast} title={`6-Hour Forecast`} color="#10b981" />
                                    </div>
                                </div>
                            </TiltCard>

                            <TiltCard delay="1.2s" depth={12}>
                                <div className="glass-panel p-8 rounded-[2rem] flex flex-col h-full relative group">
                                    <div className="absolute inset-0 opacity-0 group-hover:opacity-10 transition-opacity duration-700" style={{background: `radial-gradient(circle at 50% 50%, #8b5cf6, transparent 70%)`}}></div>
                                    <div className="mb-8 glass-content" style={{ transform: 'translateZ(30px)' }}>
                                        <h3 className="text-2xl font-black text-white mb-2 flex items-center gap-3 tracking-tight">
                                            <i className="fas fa-shield-halved text-secondary"></i> Defense Protocols
                                        </h3>
                                        <p className="text-sm text-muted font-mono ml-9">System-enforced safety directives.</p>
                                    </div>
                                    
                                    <div className="space-y-4 flex-1 glass-content" style={{ transform: 'translateZ(40px)' }}>
                                        {[
                                            { id: 'mask', icon: 'fa-mask-face', title: 'Respiratory Defense', short: aqiInfo.mask, detail: `Current particle density dictates this action. Airborne particulate matter at this level can bypass natural biological filters.` },
                                            { id: 'hvac', icon: 'fa-house-signal', title: 'Perimeter Seal', short: data.current.aqi > 150 ? 'Seal environment immediately.' : 'Natural ventilation is optimal.', detail: data.current.aqi > 150 ? 'Outdoor air quality is toxic. Close all windows. Engage HEPA filters.' : 'Outdoor air is clean enough to flush indoor accumulated VOCs and CO2.' }
                                        ].map(prot => (
                                            <div key={prot.id} onClick={() => setExpandedProtocols(prev => ({...prev,[prot.id]: !prev[prot.id]}))} className="bg-black/40 p-5 rounded-2xl border border-white/5 cursor-pointer hover:border-primary/50 transition-all hover:bg-black/60 shadow-lg group/item">
                                                <div className="flex items-center gap-5">
                                                    <div className={`w-14 h-14 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center shrink-0 transition-colors shadow-inner ${expandedProtocols[prot.id] ? 'bg-primary/20 text-primary border-primary/40' : 'text-muted group-hover/item:text-white'}`}>
                                                        <i className={`fas ${prot.icon} text-2xl`}></i>
                                                    </div>
                                                    <div className="flex-1">
                                                        <div className="flex justify-between items-center mb-1">
                                                            <h4 className="font-bold text-white text-lg tracking-tight">{prot.title}</h4>
                                                            <i className={`fas fa-chevron-down text-sm transition-transform duration-300 ${expandedProtocols[prot.id] ? 'rotate-180 text-primary' : 'text-muted'}`}></i>
                                                        </div>
                                                        <p className="text-sm text-primary/80 font-mono">{prot.short}</p>
                                                    </div>
                                                </div>
                                                <div className={`text-sm text-gray-400 pl-[76px] overflow-hidden transition-all duration-300 ${expandedProtocols[prot.id] ? 'max-h-40 opacity-100 mt-4' : 'max-h-0 opacity-0'}`}>
                                                    <div className="p-4 bg-black/50 rounded-xl border-l-4 border-l-primary leading-relaxed font-mono text-xs">{prot.detail}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </TiltCard>
                        </div>
                    </main>

                    <footer className="relative z-10 py-8 border-t border-white/10 bg-[#030305]/80 backdrop-blur-xl mt-12 w-full">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-4 text-xs font-mono text-muted">
                                <i className="fas fa-satellite-dish animate-pulse text-primary"></i>
                                <span>ZENITH CORE SYSTEM v2.4.0</span>
                            </div>
                            <button onClick={() => setShowAboutModal(true)} className="text-xs font-mono text-primary/50 hover:text-primary transition-colors flex items-center gap-2 border border-primary/20 hover:border-primary/50 bg-primary/5 px-4 py-2 rounded-lg cursor-pointer">
                                <i className="fas fa-circle-info"></i> ABOUT_SYSTEM
                            </button>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
